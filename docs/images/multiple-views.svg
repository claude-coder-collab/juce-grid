<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <rect x="20" y="95" width="230" height="140" rx="10" fill="#eef4fb" stroke="#4a78b0" stroke-width="2"/>
  <text x="135" y="125" text-anchor="middle" font-weight="bold" font-size="16">DataSource</text>
  <text x="135" y="150" text-anchor="middle" font-size="13">storage rows, source columns</text>
  <text x="135" y="172" text-anchor="middle" font-size="13">getValue, setValue, insertRows...</text>
  <text x="135" y="200" text-anchor="middle" font-size="13" font-style="italic">notifier (storage indices)</text>

  <rect x="320" y="30" width="230" height="120" rx="10" fill="#fdf6e8" stroke="#c08a24" stroke-width="2"/>
  <text x="435" y="58" text-anchor="middle" font-weight="bold">ViewModel A</text>
  <text x="435" y="82" text-anchor="middle" font-size="13">own RowOrder (its own sort)</text>
  <text x="435" y="104" text-anchor="middle" font-size="13">all columns</text>
  <text x="435" y="128" text-anchor="middle" font-size="13" font-style="italic">bind() → GridModel</text>

  <rect x="320" y="180" width="230" height="120" rx="10" fill="#fdf6e8" stroke="#c08a24" stroke-width="2"/>
  <text x="435" y="208" text-anchor="middle" font-weight="bold">ViewModel B</text>
  <text x="435" y="232" text-anchor="middle" font-size="13">own RowOrder</text>
  <text x="435" y="254" text-anchor="middle" font-size="13">columns { 1, 2, 3 }</text>
  <text x="435" y="278" text-anchor="middle" font-size="13" font-style="italic">bind() → GridModel</text>

  <rect x="620" y="45" width="220" height="90" rx="10" fill="#eef8ef" stroke="#3d8b4f" stroke-width="2"/>
  <text x="730" y="85" text-anchor="middle" font-weight="bold">Grid A</text>
  <text x="730" y="108" text-anchor="middle" font-size="13">selection, sizes, hidden</text>
  <rect x="620" y="195" width="220" height="90" rx="10" fill="#eef8ef" stroke="#3d8b4f" stroke-width="2"/>
  <text x="730" y="235" text-anchor="middle" font-weight="bold">Grid B</text>
  <text x="730" y="258" text-anchor="middle" font-size="13">selection, sizes, hidden</text>

  <g stroke="#444" stroke-width="2" marker-end="url(#a)">
    <line x1="255" y1="140" x2="314" y2="95"/>
    <line x1="255" y1="190" x2="314" y2="235"/>
    <line x1="555" y1="90" x2="614" y2="90"/>
    <line x1="555" y1="240" x2="614" y2="240"/>
  </g>
  <text x="430" y="322" text-anchor="middle" font-size="12" fill="#555">Each ViewModel translates view rows/columns to storage rows/source columns, and storage changes back to view changes.</text>
</svg>
