<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="370" fill="#ffffff"/>
  <rect x="20" y="60" width="220" height="200" rx="10" fill="#eef4fb" stroke="#4a78b0" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-weight="bold" font-size="16">Your data</text>
  <text x="130" y="118" text-anchor="middle">vectors, a database,</text>
  <text x="130" y="138" text-anchor="middle">a document model...</text>
  <rect x="45" y="165" width="170" height="70" rx="8" fill="#ffffff" stroke="#4a78b0"/>
  <text x="130" y="192" text-anchor="middle" font-weight="bold">GridModelNotifier</text>
  <text x="130" y="214" text-anchor="middle" font-size="12">owned by your model</text>

  <rect x="320" y="40" width="220" height="250" rx="10" fill="#fdf6e8" stroke="#c08a24" stroke-width="2"/>
  <text x="430" y="70" text-anchor="middle" font-weight="bold" font-size="16">GridModel</text>
  <text x="430" y="92" text-anchor="middle" font-size="12">a struct of std::function callbacks</text>
  <text x="340" y="124" font-size="13">rowCount, colCount, getValue</text>
  <text x="340" y="146" font-size="13">setValue, validate, isEditable</text>
  <text x="340" y="168" font-size="13">compare, reorderRows</text>
  <text x="340" y="190" font-size="13">insertRows, removeRows...</text>
  <text x="340" y="212" font-size="13">undo, redo, batches</text>
  <text x="340" y="234" font-size="13">colName, rowName, contextMenu</text>
  <text x="340" y="262" font-size="13" font-style="italic">notifier → your notifier</text>

  <rect x="620" y="60" width="220" height="200" rx="10" fill="#eef8ef" stroke="#3d8b4f" stroke-width="2"/>
  <text x="730" y="90" text-anchor="middle" font-weight="bold" font-size="16">jgrid::Grid</text>
  <text x="730" y="118" text-anchor="middle">a juce::Component</text>
  <text x="730" y="146" text-anchor="middle" font-size="13">cursor, selection, scrolling,</text>
  <text x="730" y="166" text-anchor="middle" font-size="13">sizes, hidden rows/columns,</text>
  <text x="730" y="186" text-anchor="middle" font-size="13">editor, clipboard, menus,</text>
  <text x="730" y="206" text-anchor="middle" font-size="13">keyboard, accessibility</text>

  <line x1="615" y1="120" x2="548" y2="120" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="110" text-anchor="middle" font-size="12">calls</text>
  <line x1="315" y1="120" x2="248" y2="120" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="98" text-anchor="middle" font-size="12">reads /</text>
  <text x="282" y="112" text-anchor="middle" font-size="12">writes</text>
  <path d="M130,236 L130,320 L730,320 L730,268" fill="none" stroke="#3d8b4f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="430" y="345" text-anchor="middle" font-size="12" fill="#2f6b3d">changed(Change): CellsChanged, RowsInserted, RowsRemoved, RowsReordered, Reset</text>
  <text x="430" y="25" text-anchor="middle" font-size="13" fill="#555">Grid.setModel(model) binds them; the Grid subscribes to model.notifier</text>
</svg>
