<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="140" y="30" text-anchor="middle" font-weight="bold">Storage (never moves)</text>
  <text x="620" y="30" text-anchor="middle" font-weight="bold">What the Grid shows</text>
  <text x="380" y="30" text-anchor="middle" font-weight="bold">RowOrder</text>
  <g font-size="14">
    <rect x="40" y="50" width="200" height="40" fill="#eef4fb" stroke="#4a78b0"/><text x="55" y="76">0  Casey · Synth · 28</text>
    <rect x="40" y="95" width="200" height="40" fill="#eef4fb" stroke="#4a78b0"/><text x="55" y="121">1  Alex · Piano · 59</text>
    <rect x="40" y="140" width="200" height="40" fill="#eef4fb" stroke="#4a78b0"/><text x="55" y="166">2  Robin · Vocal · 3</text>
    <rect x="520" y="50" width="200" height="40" fill="#eef8ef" stroke="#3d8b4f"/><text x="535" y="76">row 0  Robin · Vocal · 3</text>
    <rect x="520" y="95" width="200" height="40" fill="#eef8ef" stroke="#3d8b4f"/><text x="535" y="121">row 1  Casey · Synth · 28</text>
    <rect x="520" y="140" width="200" height="40" fill="#eef8ef" stroke="#3d8b4f"/><text x="535" y="166">row 2  Alex · Piano · 59</text>
    <rect x="320" y="50" width="120" height="130" rx="8" fill="#fdf6e8" stroke="#c08a24"/>
    <text x="380" y="85" text-anchor="middle">view 0 → 2</text>
    <text x="380" y="120" text-anchor="middle">view 1 → 0</text>
    <text x="380" y="155" text-anchor="middle">view 2 → 1</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <path d="M516,75 L444,80"/>
    <path d="M516,118 L444,118"/>
    <path d="M516,160 L444,155"/>
    <path d="M316,75 C 280,75 280,160 244,160"/>
    <path d="M316,118 C 280,118 280,70 244,70"/>
    <path d="M316,160 C 280,160 280,115 244,115"/>
  </g>
  <text x="380" y="215" text-anchor="middle">Sorting by Track ascending: the Grid computes the order and calls reorderRows;</text>
  <text x="380" y="237" text-anchor="middle">the model reorders only its RowOrder, then notifies RowsReordered.</text>
  <text x="380" y="270" text-anchor="middle" fill="#555">getValue(row, col) looks up data[order.toStorage(row)][col]. Save order.getOrder() to keep the sort.</text>
</svg>
