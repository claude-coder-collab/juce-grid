name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - modules/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - modules/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the API reference
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          mkdir -p build/api
          doxygen docs/Doxyfile

      - name: Build the guide
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Add the API reference to the site
        run: sudo cp -r build/api _site/api

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
